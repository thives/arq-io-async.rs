[package]
name = "arq-io-async"
version = "0.0.1"
authors = [
  "Thomas Ivesdal-Tronstad <>",
]
license = "MIT OR Apache-2.0"
description = "Asynchronous implementation of ARQ in Rust."
repository = "https://github.com/thives/arq-io-async.rs"
keywords = ["arq", "reliable", "retrans", "io", "async"]
edition = "2024"
rust-version = "1.87"

[features]
default = ["tokio", "serde"]
embedded-io = ["dep:embedded-io-async"]
std = ["embedded-io-async?/std"]
tokio = ["std","dep:tokio"]
serde = ["dep:serde"]
defmt = ["dep:defmt", "embedded-io-async?/defmt"]

[dependencies]
defmt = { version = "1", optional = true }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
embedded-io-async = { version = "0.7", default-features = false, optional = true }
tokio = { version = "1.53", default-features = false, optional = true }

[dev-dependencies]
crc = { version = "3.4" }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]
